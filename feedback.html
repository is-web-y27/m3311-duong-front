 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phản hồi - ROYAL TRAVEL</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
  <script src="script.js" defer></script>
  <script src="feedback.js" defer></script>
  <script src="api-feedback.js" defer></script>
</head>
<body class="layout">
  <header class="header">
    <div class="header__container">
      <div class="header__logo">
        <img src="images/logo.jpg" alt="ROYAL TRAVEL Logo" />
      </div>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="index.html">Trang chủ</a></li>
          <li class="nav__item"><a href="about.html">Giới thiệu</a></li>
          <li class="nav__item"><a href="tours.html">Tour du lịch</a></li>
          <li class="nav__item"><a href="contact.html">Liên hệ</a></li>
          <li class="nav__item"><a href="feedback.html">Phản hồi</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="section">
      <h1 class="section__title">Gửi phản hồi</h1>
      <form id="feedback-form">
        <label>Họ tên: <input type="text" name="name" required /></label><br />
        <label>Email: <input type="email" name="email" required /></label><br />
        <label>Ý kiến: <textarea name="comment" required></textarea></label><br />
        <button type="submit">Gửi</button>
      </form>
    </section>

    <section class="section">
      <h2 class="section__title">Danh sách phản hồi</h2>
      <ul id="feedback-list"></ul>

      <template id="feedback-template">
        <li class="feedback__item">
          <p><strong class="name"></strong> (<span class="email"></span>)</p>
          <p class="comment"></p>
          <button class="edit-btn">Sửa</button>
        </li>
      </template>
    </section>

    <!-- ĐẶT SAPHẦN FORM HIỆN TẠI -->
<section class="section">
    <h2 class="section__title">Đánh giá từ Khách Hàng (Mẫu)</h2>
    
    <!-- Preloader (ẩn ban đầu) -->
    <div id="api-preloader" class="preloader" style="display: none;">
        <div class="spinner"></div>
        <p>Đang tải đánh giá...</p>
    </div>
    
    <!-- Thông báo lỗi (ẩn ban đầu) -->
    <div id="api-error" class="error-message" style="display: none; color: #d32f2f; padding: 1em; background: #ffebee; border-radius: 5px;">
        <!-- Nội dung lỗi sẽ được thêm bằng JS -->
    </div>
    
    <!-- Danh sách đánh giá từ API -->
    <div id="api-feedback-list" class="feedback-list">
        <!-- Dữ liệu từ API sẽ được thêm vào đây -->
    </div>
    
    <!-- Nút tải lại dữ liệu (tuỳ chọn) -->
    <button id="reload-api-btn" class="btn" style="margin-top: 1em;">Tải thêm đánh giá mẫu</button>
</section>

<!-- THÊM TEMPLATE MỚI CHO API -->
<template id="api-feedback-template">
    <div class="feedback__item api-item">
        <p><strong class="api-name"></strong> 
           (<span class="api-email"></span>)</p>
        <p class="api-body"></p>
        <small class="api-post-id">Mã bài viết: <span></span></small>
    </div>
</template>

  </main>

  <footer class="footer">
    <p>&copy; 2025 ROYAL TRAVEL. All rights reserved.</p>
  </footer>
</body>
</html>
